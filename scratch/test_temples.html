<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #FAF8F7; padding: 40px; display: flex; justify-content: center; }
    .temple-box { width: 440px; height: 135px; position: relative; }
    .temple-box svg { width: 100%; height: 100%; overflow: visible; }
  </style>
</head>
<body>
  <div class="temple-box">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 135" fill="none" class="temple-skyline-svg">
  <defs>
    <!-- Facet Gradients for authentic 3D Nagara Shikhara -->
    <linearGradient id="shik-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DE918A"/>
      <stop offset="100%" stop-color="#CF7870"/>
    </linearGradient>
    <linearGradient id="shik-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCEEEB"/>
      <stop offset="100%" stop-color="#F7D8D3"/>
    </linearGradient>

    <linearGradient id="shik-center-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2928B"/>
      <stop offset="100%" stop-color="#C76961"/>
    </linearGradient>
    <linearGradient id="shik-center-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF6F4"/>
      <stop offset="100%" stop-color="#F9DAD5"/>
    </linearGradient>

    <!-- Morning Sun / Spiritual Aura -->
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FED7D7" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FEE2E2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FAF8F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Hill Gradient -->
    <linearGradient id="hill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEE2E2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F87171" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- 1. Background Sun Aura (Soft Round Peach/Pink Disk) -->
  <circle cx="345" cy="50" r="50" fill="url(#sun-glow)"/>

  <!-- 2. Sweeping Background Hill / Dune to the right -->
  <path d="M220 125 C300 85, 380 65, 440 80 L440 135 L220 135 Z" fill="url(#hill-grad)" opacity="0.6"/>
  <path d="M-20 128 C80 118, 180 124, 280 116 C340 112, 390 120, 440 115" stroke="#FECACA" stroke-width="1.2" fill="none" opacity="0.5"/>

  <!-- LAYER 1 (BACKMOST): Small Outer Shikharas -->
  <!-- Far-Left Shikhara 1 -->
  <g>
    <path d="M75 125 C78 110, 83 94, 88 80 C90 75, 92 72, 93 70 L93 125 Z" fill="url(#shik-shadow)"/>
    <path d="M93 70 C94 72, 96 75, 98 80 C103 94, 108 110, 111 125 L93 125 Z" fill="url(#shik-light)"/>
    <line x1="93" y1="70" x2="93" y2="125" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>
    <line x1="93" y1="70" x2="93" y2="62" stroke="#DC2626" stroke-width="1.1"/>
    <path d="M93 62 L102 65 L93 68 Z" fill="#DC2626"/>
  </g>

  <!-- Far-Right Shikhara 7 -->
  <g>
    <path d="M370 125 C373 112, 377 98, 382 86 C384 81, 386 78, 387 76 L387 125 Z" fill="url(#shik-shadow)"/>
    <path d="M387 76 C388 78, 390 81, 392 86 C397 98, 401 112, 404 125 L387 125 Z" fill="url(#shik-light)"/>
    <line x1="387" y1="76" x2="387" y2="125" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>
    <line x1="387" y1="76" x2="387" y2="68" stroke="#DC2626" stroke-width="1.1"/>
    <path d="M387 68 L396 71 L387 74 Z" fill="#DC2626"/>
  </g>

  <!-- LAYER 2 (MID-BACKGROUND): Intermediate Shikharas -->
  <!-- Left-Mid Shikhara 2 -->
  <g>
    <path d="M102 125 C107 102, 115 82, 124 66 C127 60, 130 55, 132 52 L132 125 Z" fill="url(#shik-shadow)"/>
    <path d="M132 52 C134 55, 137 60, 140 66 C149 82, 157 102, 162 125 L132 125 Z" fill="url(#shik-light)"/>
    <line x1="132" y1="52" x2="132" y2="125" stroke="#FFFFFF" stroke-width="0.9" opacity="0.7"/>
    <path d="M116 102 Q132 96 148 102" stroke="#C76961" stroke-width="0.8" fill="none" opacity="0.5"/>
    <path d="M121 82 Q132 77 143 82" stroke="#C76961" stroke-width="0.8" fill="none" opacity="0.5"/>
    <line x1="132" y1="52" x2="132" y2="42" stroke="#DC2626" stroke-width="1.2"/>
    <path d="M132 42 L143 45.5 L132 49 Z" fill="#DC2626"/>
  </g>

  <!-- Right-Mid Shikhara 6 -->
  <g>
    <path d="M326 125 C331 104, 338 84, 346 68 C348 63, 351 58, 353 55 L353 125 Z" fill="url(#shik-shadow)"/>
    <path d="M353 55 C355 58, 358 63, 360 68 C368 84, 375 104, 380 125 L353 125 Z" fill="url(#shik-light)"/>
    <line x1="353" y1="55" x2="353" y2="125" stroke="#FFFFFF" stroke-width="0.9" opacity="0.7"/>
    <line x1="353" y1="55" x2="353" y2="45" stroke="#DC2626" stroke-width="1.2"/>
    <path d="M353 45 L364 48.5 L353 52 Z" fill="#DC2626"/>
  </g>

  <!-- LAYER 3 (PRIMARY MIDGROUND): Flanking Primary Shikharas -->
  <!-- Left Primary Shikhara 3 -->
  <g>
    <path d="M140 125 C147 95, 160 66, 175 40 C179 32, 183 26, 186 22 L186 125 Z" fill="url(#shik-shadow)"/>
    <path d="M186 22 C189 26, 193 32, 197 40 C212 66, 225 95, 232 125 L186 125 Z" fill="url(#shik-light)"/>
    <line x1="186" y1="22" x2="186" y2="125" stroke="#FFFFFF" stroke-width="1.1" opacity="0.8"/>
    <!-- Nagara curved ridges -->
    <path d="M158 100 Q186 92 214 100" stroke="#C76961" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M166 78 Q186 71 206 78" stroke="#C76961" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M174 54 Q186 48 198 54" stroke="#C76961" stroke-width="0.9" fill="none" opacity="0.55"/>
    <!-- Kalasha & Flag -->
    <ellipse cx="186" cy="22" rx="4.5" ry="2" fill="#FCEEEB" stroke="#C76961" stroke-width="0.8"/>
    <line x1="186" y1="21" x2="186" y2="9" stroke="#DC2626" stroke-width="1.4"/>
    <path d="M186 9 L200 13 L186 17 Z" fill="#DC2626"/>
  </g>

  <!-- Right Primary Shikhara 5 -->
  <g>
    <path d="M272 125 C279 98, 290 70, 303 44 C307 36, 311 30, 314 26 L314 125 Z" fill="url(#shik-shadow)"/>
    <path d="M314 26 C317 30, 321 36, 325 44 C338 70, 349 98, 356 125 L314 125 Z" fill="url(#shik-light)"/>
    <line x1="314" y1="26" x2="314" y2="125" stroke="#FFFFFF" stroke-width="1.1" opacity="0.8"/>
    <path d="M288 100 Q314 93 340 100" stroke="#C76961" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M295 78 Q314 72 333 78" stroke="#C76961" stroke-width="1" fill="none" opacity="0.55"/>
    <path d="M303 56 Q314 51 325 56" stroke="#C76961" stroke-width="0.9" fill="none" opacity="0.55"/>
    <ellipse cx="314" cy="26" rx="4.5" ry="2" fill="#FCEEEB" stroke="#C76961" stroke-width="0.8"/>
    <line x1="314" y1="25" x2="314" y2="13" stroke="#DC2626" stroke-width="1.4"/>
    <path d="M314 13 L328 17 L314 21 Z" fill="#DC2626"/>
  </g>

  <!-- LAYER 4 (FOREGROUND HERO): GRAND TALLEST CENTRAL SHIKHARA 4 -->
  <g>
    <!-- Left shaded facet (graceful Nagara parabolic curve) -->
    <path d="M198 125 C208 88, 226 50, 243 20 C248 11, 253 5, 255 2 L255 125 Z" fill="url(#shik-center-shadow)"/>
    <!-- Right highlighted facet (graceful Nagara parabolic curve) -->
    <path d="M255 2 C257 5, 262 11, 267 20 C284 50, 302 88, 312 125 L255 125 Z" fill="url(#shik-center-light)"/>
    <!-- Prominent central white spine ridge -->
    <line x1="255" y1="2" x2="255" y2="125" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Architectural Horizontal Shikhara Ridges -->
    <path d="M220 104 Q255 94 290 104" stroke="#C76961" stroke-width="1.3" fill="none" opacity="0.6"/>
    <path d="M228 82 Q255 73 282 82" stroke="#C76961" stroke-width="1.2" fill="none" opacity="0.6"/>
    <path d="M236 58 Q255 51 274 58" stroke="#C76961" stroke-width="1.1" fill="none" opacity="0.6"/>
    <path d="M243 36 Q255 30 267 36" stroke="#C76961" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M249 18 Q255 14 261 18" stroke="#C76961" stroke-width="0.9" fill="none" opacity="0.6"/>

    <!-- Sacred Kalasha & Amalaka at summit -->
    <ellipse cx="255" cy="2" rx="6" ry="2.5" fill="#FFF6F4" stroke="#C76961" stroke-width="1"/>
    <circle cx="255" cy="-2" r="3" fill="#E2928B" stroke="#C76961" stroke-width="0.8"/>
    
    <!-- Large Fluttering Auspicious Crimson Pennant Flag -->
    <line x1="255" y1="-2" x2="255" y2="-16" stroke="#DC2626" stroke-width="1.6"/>
    <path d="M255 -16 C268 -18, 276 -11, 286 -14 L276 -5 C269 -7, 263 -6, 255 -7 Z" fill="#DC2626"/>
  </g>

  <!-- LAYER 5: Soft Base Foundation Plinth -->
  <path d="M60 122 C140 120, 240 122, 340 120 C380 119, 420 121, 440 120" stroke="#C76961" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>
  </div>
</body>
</html>
