<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 135" fill="none" class="temple-skyline-svg">
  <defs>
    <!-- Facet Gradients for genuine 3D Shikhara Volume -->
    <linearGradient id="shik-left-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DF948E"/>
      <stop offset="100%" stop-color="#D27F78"/>
    </linearGradient>
    <linearGradient id="shik-right-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCECE9"/>
      <stop offset="100%" stop-color="#F8D6D1"/>
    </linearGradient>

    <linearGradient id="shik-center-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E39690"/>
      <stop offset="100%" stop-color="#CD746D"/>
    </linearGradient>
    <linearGradient id="shik-center-r" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF4F2"/>
      <stop offset="100%" stop-color="#F7D7D2"/>
    </linearGradient>

    <!-- Morning Sun / Spiritual Aura -->
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FED7D7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FEE2E2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FAF8F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Dune gradient -->
    <linearGradient id="dune-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEE2E2" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FCA5A5" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- 1. Background Sun Aura -->
  <circle cx="350" cy="55" r="55" fill="url(#sun-glow)"/>

  <!-- 2. Gentle Background Dune Curves -->
  <path d="M260 120 C320 80, 390 65, 460 75 L460 135 L260 135 Z" fill="url(#dune-grad)" opacity="0.65"/>
  <path d="M-20 125 C80 115, 180 120, 280 112 C340 108, 400 116, 460 110" stroke="#FECACA" stroke-width="1.2" fill="none" opacity="0.5"/>

  <!-- 3. Base Terrace / Plinth -->
  <path d="M100 120 L440 120 L440 135 L100 135 Z" fill="#E39690" opacity="0.3"/>
  <path d="M110 118 L430 118" stroke="#D27F78" stroke-width="1.5" opacity="0.6"/>

  <!-- 4. Temple Spire 1 (Far-Left Smallest Shikhara) -->
  <g>
    <!-- Left shaded facet -->
    <path d="M110 120 C113 105, 117 90, 122 78 C124 73, 126 70, 127 68 L127 120 Z" fill="url(#shik-left-1)"/>
    <!-- Right highlight facet -->
    <path d="M127 68 C128 70, 130 73, 132 78 C137 90, 141 105, 144 120 L127 120 Z" fill="url(#shik-right-1)"/>
    <!-- Central spine -->
    <line x1="127" y1="68" x2="127" y2="120" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>
    <!-- Flag -->
    <line x1="127" y1="68" x2="127" y2="60" stroke="#DC2626" stroke-width="1.2"/>
    <path d="M127 60 L136 63 L127 66 Z" fill="#DC2626"/>
  </g>

  <!-- 5. Temple Spire 2 (Mid-Left Small Shikhara) -->
  <g>
    <!-- Left shaded facet -->
    <path d="M136 120 C139 100, 145 84, 152 70 C154 65, 157 61, 158 59 L158 120 Z" fill="url(#shik-left-1)"/>
    <!-- Right highlight facet -->
    <path d="M158 59 C159 61, 162 65, 164 70 C171 84, 177 100, 180 120 L158 120 Z" fill="url(#shik-right-1)"/>
    <!-- Central spine -->
    <line x1="158" y1="59" x2="158" y2="120" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7"/>
    <!-- Tier ridges -->
    <path d="M146 100 Q158 95 170 100" stroke="#CD746D" stroke-width="0.8" fill="none" opacity="0.5"/>
    <path d="M150 82 Q158 78 166 82" stroke="#CD746D" stroke-width="0.8" fill="none" opacity="0.5"/>
    <!-- Flag -->
    <line x1="158" y1="59" x2="158" y2="50" stroke="#DC2626" stroke-width="1.2"/>
    <path d="M158 50 L168 53.5 L158 57 Z" fill="#DC2626"/>
  </g>

  <!-- 6. Temple Spire 3 (Medium Left Foreground Shikhara) -->
  <g>
    <!-- Left facet -->
    <path d="M168 120 C173 95, 182 70, 193 46 C196 38, 199 33, 201 30 L201 120 Z" fill="url(#shik-left-1)"/>
    <!-- Right facet -->
    <path d="M201 30 C203 33, 206 38, 209 46 C220 70, 229 95, 234 120 L201 120 Z" fill="url(#shik-right-1)"/>
    <!-- Central spine -->
    <line x1="201" y1="30" x2="201" y2="120" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
    <!-- Tier horizontal curved ridges -->
    <path d="M180 98 Q201 91 222 98" stroke="#CD746D" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M186 78 Q201 72 216 78" stroke="#CD746D" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M192 56 Q201 51 210 56" stroke="#CD746D" stroke-width="0.9" fill="none" opacity="0.6"/>
    <!-- Amalaka finial and Flag -->
    <ellipse cx="201" cy="30" rx="4" ry="1.8" fill="#F8D6D1" stroke="#CD746D" stroke-width="0.8"/>
    <line x1="201" y1="29" x2="201" y2="18" stroke="#DC2626" stroke-width="1.3"/>
    <path d="M201 18 L213 22 L201 26 Z" fill="#DC2626"/>
  </g>

  <!-- 7. Temple Spire 4 (GRAND TALLEST CENTRAL SHIKHARA) -->
  <g>
    <!-- Left facet (curving parabola) -->
    <path d="M218 120 C224 85, 238 50, 252 24 C256 16, 261 10, 263 7 L263 120 Z" fill="url(#shik-center-l)"/>
    <!-- Right facet (curving parabola) -->
    <path d="M263 7 C265 10, 270 16, 274 24 C288 50, 302 85, 308 120 L263 120 Z" fill="url(#shik-center-r)"/>
    <!-- Prominent central spine line -->
    <line x1="263" y1="7" x2="263" y2="120" stroke="#FFFFFF" stroke-width="1.4" opacity="0.85"/>
    <!-- Architectural Shikhara Horizontal Ridges -->
    <path d="M234 100 Q263 92 292 100" stroke="#CD746D" stroke-width="1.2" fill="none" opacity="0.6"/>
    <path d="M241 80 Q263 73 285 80" stroke="#CD746D" stroke-width="1.2" fill="none" opacity="0.6"/>
    <path d="M248 58 Q263 52 278 58" stroke="#CD746D" stroke-width="1.1" fill="none" opacity="0.6"/>
    <path d="M254 38 Q263 33 272 38" stroke="#CD746D" stroke-width="1" fill="none" opacity="0.6"/>
    <!-- Kalasha and Amalaka at peak -->
    <ellipse cx="263" cy="7" rx="5" ry="2.2" fill="#FFF4F2" stroke="#CD746D" stroke-width="1"/>
    <circle cx="263" cy="4" r="2.5" fill="#E39690" stroke="#CD746D" stroke-width="0.8"/>
    <!-- Red Pennant Flag fluttering right -->
    <line x1="263" y1="4" x2="263" y2="-8" stroke="#DC2626" stroke-width="1.5"/>
    <path d="M263 -8 C273 -9, 278 -4, 285 -6 L278 1 C272 -1, 268 0, 263 -1 Z" fill="#DC2626"/>
  </g>

  <!-- 8. Temple Spire 5 (Medium Right Foreground Shikhara) -->
  <g>
    <!-- Left facet -->
    <path d="M294 120 C299 96, 307 72, 317 48 C320 40, 323 35, 325 32 L325 120 Z" fill="url(#shik-left-1)"/>
    <!-- Right facet -->
    <path d="M325 32 C327 35, 330 40, 333 48 C343 72, 351 96, 356 120 L325 120 Z" fill="url(#shik-right-1)"/>
    <!-- Central spine -->
    <line x1="325" y1="32" x2="325" y2="120" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
    <!-- Tier horizontal ridges -->
    <path d="M305 98 Q325 92 345 98" stroke="#CD746D" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M311 78 Q325 73 339 78" stroke="#CD746D" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M317 56 Q325 52 333 56" stroke="#CD746D" stroke-width="0.9" fill="none" opacity="0.6"/>
    <!-- Amalaka finial and Flag -->
    <ellipse cx="325" cy="32" rx="4" ry="1.8" fill="#F8D6D1" stroke="#CD746D" stroke-width="0.8"/>
    <line x1="325" y1="31" x2="325" y2="20" stroke="#DC2626" stroke-width="1.3"/>
    <path d="M325 20 L337 24 L325 28 Z" fill="#DC2626"/>
  </g>

  <!-- 9. Temple Spire 6 (Right Outer Small Shikhara) -->
  <g>
    <!-- Left facet -->
    <path d="M345 120 C349 104, 355 88, 362 74 C364 69, 367 65, 368 63 L368 120 Z" fill="url(#shik-left-1)"/>
    <!-- Right facet -->
    <path d="M368 63 C369 65, 372 69, 374 74 C381 88, 387 104, 391 120 L368 120 Z" fill="url(#shik-right-1)"/>
    <!-- Central spine -->
    <line x1="368" y1="63" x2="368" y2="120" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7"/>
    <!-- Flag -->
    <line x1="368" y1="63" x2="368" y2="54" stroke="#DC2626" stroke-width="1.2"/>
    <path d="M368 54 L378 57.5 L368 61 Z" fill="#DC2626"/>
  </g>

  <!-- 10. Temple Spire 7 (Far-Right Tiny Finial Shikhara) -->
  <g>
    <path d="M385 120 C388 110, 392 98, 396 88 C398 84, 400 81, 401 79 L401 120 Z" fill="url(#shik-left-1)"/>
    <path d="M401 79 C402 81, 404 84, 406 88 C410 98, 414 110, 417 120 L401 120 Z" fill="url(#shik-right-1)"/>
    <line x1="401" y1="79" x2="401" y2="72" stroke="#DC2626" stroke-width="1.1"/>
    <path d="M401 72 L409 75 L401 78 Z" fill="#DC2626"/>
  </g>
</svg>
